<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Goal</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <main>
        <!-- HERO / DASHBOARD -->
        <section>

            <div class="dashboard">
                <div class="dashboard-upgrade">
                    <h1 id="Current">R0</h1>
                </div>
                <div class="dashboard-upgrade">
                    <h1 id="Goal">R0</h1>
                </div>
                <div class="dashboard-upgrade">
                    <h1 id="Progress">0%</h1>
                </div>
                <div class="dashboard-upgrade">
                    <h1 id="Finish">---</h1>
                </div>
            </div>

        </section>

        <!-- INPUT SECTION -->
        <section>

            <div class="Info">

                <div style="grid-column: span 2 / span 2; grid-column-start: 2;">
                    <label for="AddAmount">Add Amount</label>
                    <input id="AddAmount" type="number" placeholder="Add Amount">
                </div>
                <div style="grid-column: span 2 / span 2; grid-column-start: 4;">
                    <label for="GoalAmount">Goal Amount</label>
                    <input id="GoalAmount" type="number" placeholder="Goal Amount">
                </div>
                <div style="grid-column: span 2 / span 2; grid-column-start: 6;">
                    <label for="SavedMoney">Saved Money</label>
                    <input id="SavedMoney" type="number" placeholder="Saved Money">
                </div>

                <div style=" grid-column: span 6 / span 6; grid-column-start: 2; grid-row-start: 2;">
                    <button id="updateBtn">Update</button>
                    <button onclick="Reset()" class="reset">Reset</button>
                </div>

            </div>    

        </section>

        <!-- PROGRESS BAR -->
        <section>

        </section>

        <!-- CHARTS SECTION -->
        <section>

        </section>

        <!-- ACTIVITY HISTORY -->
        <section>

            <p id="ActivityHistory"></p>
            
        </section>

    </main>

    <footer>

    </footer>
    
</body>

<script src="Backend.js"> </script>
</html>
